<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetanus</title>
  <style>
    body {
      background: black;
      color: limegreen;
      font-family: 'Courier New', monospace;
      margin: 0;
      overflow: hidden;
    }

    /* CRT scanline + flicker */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.15) 1px,
        transparent 2px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 999;
      animation: flicker 2s infinite alternate;
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.8; }
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: rgba(0,0,0,0.9);
      border: 2px solid limegreen;
      image-rendering: pixelated;
    }

    .hud {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 16px;
      color: limegreen;
      text-shadow: 0 0 4px limegreen;
    }

    .title {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 24px;
      color: limegreen;
      font-weight: bold;
      text-shadow: 0 0 6px limegreen;
    }

    .score {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 16px;
      text-align: right;
    }

    #gameOver {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      color: red;
      text-shadow: 0 0 10px red;
      display: none;
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      animation: starTwinkle 2s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div class="title">Tetanus</div>
  <div class="hud" id="timer">Time Left: 300</div>
  <div class="score" id="score">Score: 0</div>
  <canvas id="tetris" width="240" height="400"></canvas>
  <div id="gameOver">GAME OVER</div>

  <script>
    /* 🌌 Starfield */
    for (let i = 0; i < 100; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.top = Math.random() * 100 + '%';
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDuration = (1 + Math.random() * 3) + 's';
      document.body.appendChild(s);
    }

    /* 🎵 Audio setup */
    const bleep = new Audio('Bleep (mxd).wav');
    const gulp = new Audio('G U L P (mxd).wav');
    bleep.loop = false;
    gulp.loop = false;
    bleep.volume = 0.7;
    gulp.volume = 0.7;
    bleep.playbackRate = 1.25; // 25% faster playback

    async function playAudio() {
      try {
        await bleep.play();
        bleep.onended = async () => {
          await gulp.play();
          gulp.onended = async () => {
            await bleep.play();
          };
        };
      } catch (err) {
        console.log('Audio autoplay blocked:', err);
      }
    }
    window.addEventListener('load', playAudio);
    /* 🎮 Gameplay setup */
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const ROWS = 20;
    const COLS = 12;
    const BLOCK = 20;

    const colors = ['#00FF99', '#FF0044', '#CCCCCC']; // pill, cig, pipe
    const shapes = [
      [[1,1]], // pill horizontal
      [[1],[1]], // cig vertical
      [[1,1,1]]  // pipe
    ];

    let field = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    let current, pos, score = 0, timer = 300;
    let dropInterval = 50; // very fast drop speed
    let lastDrop = 0;
    let gameOver = false;

    function newPiece() {
      const id = Math.floor(Math.random() * shapes.length);
      const shape = shapes[id];
      pos = {x: Math.floor(COLS/2) - Math.floor(shape[0].length/2), y: 0};
      current = {id, shape};
      if (collide(field, current, pos)) endGame();
    }

    function collide(field, piece, offset) {
      for (let y = 0; y < piece.shape.length; y++) {
        for (let x = 0; x < piece.shape[y].length; x++) {
          if (piece.shape[y][x] &&
             (field[y + offset.y] && field[y + offset.y][x + offset.x]) !== 0)
             return true;
        }
      }
      return false;
    }

    function merge(field, piece, offset) {
      piece.shape.forEach((row, y) => {
        row.forEach((val, x) => {
          if (val) field[y + offset.y][x + offset.x] = piece.id + 1;
        });
      });
    }

    function clearLines() {
      let lines = 0;
      field = field.filter(row => {
        if (row.every(v => v !== 0)) {
          lines++;
          return false;
        }
        return true;
      });
      while (field.length < ROWS) field.unshift(Array(COLS).fill(0));
      if (lines > 0) score -= lines * 50;
      document.getElementById('score').textContent = `Score: ${score}`;
    }

    function drawBlock(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * BLOCK, y * BLOCK, BLOCK - 1, BLOCK - 1);
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      field.forEach((row, y) => row.forEach((val, x) => {
        if (val) drawBlock(x, y, colors[val-1]);
      }));
      if (current) {
        current.shape.forEach((row, y) => row.forEach((val, x) => {
          if (val) drawBlock(x + pos.x, y + pos.y, colors[current.id]);
        }));
      }
    }

    function drop() {
      pos.y++;
      if (collide(field, current, pos)) {
        pos.y--;
        merge(field, current, pos);
        clearLines();
        newPiece();
      }
      lastDrop = Date.now();
    }

    function update() {
      if (gameOver) return;
      const now = Date.now();
      if (now - lastDrop > dropInterval) drop();
      draw();
      requestAnimationFrame(update);
    }

    function endGame() {
      gameOver = true;
      document.getElementById('gameOver').style.display = 'block';
      setTimeout(() => {
        resetGame();
      }, 3000);
    }

    function resetGame() {
      field = Array.from({length: ROWS}, () => Array(COLS).fill(0));
      score = 0;
      document.getElementById('score').textContent = 'Score: 0';
      document.getElementById('gameOver').style.display = 'none';
      timer = 300;
      gameOver = false;
      newPiece();
      update();
    }

    newPiece();
    update();

    /* ⏱ Timer countdown */
    setInterval(() => {
      if (!gameOver) {
        timer--;
        document.getElementById('timer').textContent = `Time Left: ${timer}`;
        if (timer <= 0) endGame();
      }
    }, 1000);
  </script>
</body>
</html>
