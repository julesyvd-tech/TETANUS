<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TETANUS</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    height: 100%;
    font-family: "Press Start 2P", monospace;
    color: #00ffcc;
  }

  /* --- Starfield --- */
  canvas#stars {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* --- CRT scanlines --- */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.04) 0px,
      rgba(255,255,255,0.04) 1px,
      transparent 2px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    z-index: 3;
  }

  /* --- Overlay HUD --- */
  .hud {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 10px;
    z-index: 2;
    text-shadow: 0 0 5px #00ffcc;
  }
  .hud h1 {
    font-size: 14px;
    margin: 0 0 4px 0;
  }
  .timer {
    font-size: 12px;
    margin-top: 2px;
  }

  .scoreBox {
    position: fixed;
    top: 10px;
    right: 10px;
    border: 2px solid #00ffcc;
    padding: 6px;
    font-size: 10px;
    text-align: center;
    width: 90px;
    z-index: 2;
  }
  .scoreBox span {
    display: block;
    margin-top: 4px;
    font-size: 14px;
  }

  /* --- Playfield --- */
  #playfield {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    height: 480px;
    border: 2px solid #00ffcc;
    box-shadow: 0 0 12px #00ffcc55;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(20, 1fr);
    gap: 1px;
    z-index: 1;
  }

  @media (max-width: 600px) {
    #playfield {
      width: 180px;
      height: 320px;
    }
    .hud, .scoreBox { font-size: 8px; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="hud">
  <h1>TETANUS</h1>
  <div id="timer" class="timer">04:12</div>
</div>

<div id="playfield"></div>

<div class="scoreBox">
  SCORE
  <span id="scoreValue">0</span>
</div>

<audio id="bgMusic" loop></audio>

<script>
/* --- Starfield animation --- */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  stars = Array.from({length: 200}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    s: Math.random() * 1.5,
    v: 0.1 + Math.random() * 0.3
  }));
}
window.addEventListener('resize', resize);
resize();

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#00ffcc";
  for (const star of stars) {
    ctx.globalAlpha = 0.3 + Math.random() * 0.7;
    ctx.fillRect(star.x, star.y, star.s, star.s);
    star.y += star.v;
    if (star.y > canvas.height) star.y = 0;
  }
  requestAnimationFrame(drawStars);
}
drawStars();

/* --- Score slowly decreasing --- */
let score = 0;
setInterval(() => {
  score -= Math.floor(Math.random() * 3);
  document.getElementById("scoreValue").textContent = score;
}, 1000);

/* --- Timer countdown --- */
let minutes = 4, seconds = 12;
const timerEl = document.getElementById("timer");
setInterval(() => {
  if (minutes === 0 && seconds === 0) {
    timerEl.textContent = "00:00";
    timerEl.style.opacity = Math.sin(Date.now()/200) > 0 ? 1 : 0.4;
    return;
  }
  if (seconds === 0) { minutes--; seconds = 59; }
  else seconds--;
  timerEl.textContent = `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
}, 1200);

/* --- Music loop --- */
const bg = document.getElementById("bgMusic");
const tracks = ["Bleep (mxd).wav", "G U L P (mxd).wav"];
let currentTrack = 0;
function playMusic() {
  bg.src = tracks[currentTrack];
  bg.play().catch(()=>{});
  bg.onended = () => {
    currentTrack = (currentTrack + 1) % tracks.length;
    playMusic();
  };
}
document.body.addEventListener("click", () => {
  bg.volume = 0.6;
  playMusic();
}, { once: true });
</script>
</body>
</html>
<script>
/* --- Falling Object Simulation --- */
const playfield = document.getElementById("playfield");
const cols = 10;
const rows = 20;
let grid = Array.from({ length: rows }, () => Array(cols).fill(null));

const icons = ["💊", "🚬", "🧪"];
const colors = ["#ff66cc", "#ffaa00", "#66ccff"];
let fallingPieces = [];

function spawnPiece() {
  const col = Math.floor(Math.random() * cols);
  const icon = icons[Math.floor(Math.random() * icons.length)];
  const color = colors[icons.indexOf(icon)];
  fallingPieces.push({ x: col, y: 0, icon, color });
}

function renderGrid() {
  playfield.innerHTML = "";
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const div = document.createElement("div");
      div.style.width = "100%";
      div.style.height = "100%";
      div.style.display = "flex";
      div.style.alignItems = "center";
      div.style.justifyContent = "center";
      div.style.fontSize = "14px";
      div.textContent = grid[y][x]?.icon || "";
      div.style.color = grid[y][x]?.color || "#00ffcc33";
      playfield.appendChild(div);
    }
  }
  for (const p of fallingPieces) {
    const i = p.y * cols + p.x;
    if (i >= 0 && i < rows * cols) {
      const div = playfield.children[i];
      div.textContent = p.icon;
      div.style.color = p.color;
    }
  }
}

function updatePieces() {
  for (const p of fallingPieces) {
    const nextY = p.y + 1;
    if (nextY >= rows || grid[nextY][p.x]) {
      grid[p.y][p.x] = { icon: p.icon, color: p.color };
      fallingPieces = fallingPieces.filter(f => f !== p);
    } else {
      p.y++;
    }
  }
}

function clearLines() {
  let cleared = 0;
  for (let y = rows - 1; y >= 0; y--) {
    if (grid[y].every(cell => cell !== null)) {
      cleared++;
      grid.splice(y, 1);
      grid.unshift(Array(cols).fill(null));
      y++;
    }
  }
  if (cleared > 0) {
    document.getElementById("playfield").style.borderColor = "#ff66cc";
    setTimeout(() => {
      document.getElementById("playfield").style.borderColor = "#00ffcc";
    }, 300);
  }
}

function loop() {
  if (Math.random() < 0.08) spawnPiece();
  updatePieces();
  renderGrid();
  clearLines();
  requestAnimationFrame(loop);
}

loop();
</script>
<style>
/* --- CRT / VHS Overlays --- */
.crt-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    rgba(255, 255, 255, 0.03) 0px,
    rgba(0, 0, 0, 0.03) 2px
  );
  mix-blend-mode: overlay;
  animation: flicker 1.8s infinite;
  z-index: 50;
}

@keyframes flicker {
  0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
    opacity: 0.04;
  }
  20%, 24%, 55% {
    opacity: 0.12;
  }
}

/* --- Subtle VHS Wobble --- */
.vhs-warp {
  animation: vhsDrift 6s ease-in-out infinite alternate;
}

@keyframes vhsDrift {
  0% {
    transform: translateX(-2px) translateY(-1px) scale(1.001) rotate(-0.1deg);
    filter: hue-rotate(0deg);
  }
  50% {
    transform: translateX(2px) translateY(1px) scale(1.002) rotate(0.1deg);
    filter: hue-rotate(2deg);
  }
  100% {
    transform: translateX(-1px) translateY(0px) scale(1.001) rotate(0deg);
    filter: hue-rotate(-1deg);
  }
}
</style>

<script>
/* --- Apply drift and flicker layers --- */
const mainContainer = document.querySelector(".container");
mainContainer.classList.add("vhs-warp");

const crt = document.createElement("div");
crt.className = "crt-overlay";
document.body.appendChild(crt);
</script>
