<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetanus</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    /* CRT Scanline & Glow Effect */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        rgba(0,0,0,0.02) 2px
      );
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: overlay;
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.98; }
      50% { opacity: 1; }
    }

    /* Starfield Canvas */
    #stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* Main Container */
    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    /* Title + Timer + Score HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      text-align: left;
      z-index: 5;
    }
    #hud h1 {
      font-size: 1.8em;
      margin: 0;
      color: #ff3366;
    }
    #timer, #score {
      font-size: 1em;
      color: #00ffcc;
    }

    /* Game Field */
    #playfield {
      position: relative;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #00ffcc;
      width: 260px;
      height: 520px;
      display: grid;
      grid-template-rows: repeat(20, 1fr);
      grid-template-columns: repeat(10, 1fr);
      z-index: 2;
      box-shadow: 0 0 20px rgba(0,255,200,0.4);
    }

    .cell {
      width: 100%;
      height: 100%;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
    .flash {
      animation: blink 1s infinite;
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div id="game-wrapper">
    <div id="hud">
      <h1>TETANUS</h1>
      <div id="timer">Time’sUp: 03:42</div>
      <div id="score">Score: -000420</div>
    </div>

    <div id="playfield"></div>
  </div>

  <script>
  // === STARFIELD EFFECT ===
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let stars = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({length: 200}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2
    }));
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "white";
    for (let s of stars) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      s.y += 0.15;
      if (s.y > canvas.height) s.y = 0;
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();
  </script>
