<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETANUS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      color: #00fff7;
      font-family: monospace;
      height: 100%;
      width: 100%;
    }

    #crt {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.1);
      pointer-events: none;
      z-index: 5;
      mix-blend-mode: lighten;
      animation: flicker 0.12s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.9; }
      50% { opacity: 1; }
      100% { opacity: 0.85; }
    }

    canvas {
      display: block;
      margin: 80px auto 0;
      border: 2px solid #00fff7;
      box-shadow: 0 0 25px #00fff7;
      background: rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 2;
    }

    #title {
      text-align: center;
      margin-top: 20px;
      font-size: 2rem;
      letter-spacing: 4px;
      text-shadow: 0 0 10px #00fff7;
      position: relative;
      z-index: 3;
    }

    #info {
      text-align: center;
      font-size: 1rem;
      color: #00fff7;
      margin-top: 5px;
      position: relative;
      z-index: 3;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="title">TETANUS</div>
  <div id="info">
    <div id="timer">Time Left: 01:30</div>
    <div id="score">Score: 0</div>
  </div>
  <canvas id="gameCanvas" width="300" height="600"></canvas>
  <div id="crt"></div>

  <audio id="bleep" src="bleep.mp3"></audio>
  <audio id="gulp" src="gulp.mp3"></audio>

  <script>
    // === STARFIELD BACKGROUND ===
    const starCount = 75;
    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = star.style.height = Math.random() * 2 + 'px';
      star.style.top = Math.random() * 100 + '%';
      star.style.left = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 2 + 1) + 's';
      document.body.appendChild(star);
    }

    // === GAME VARIABLES ===
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const cols = 10, rows = 20, cell = 30;
    const grid = Array.from({ length: rows }, () => Array(cols).fill(0));

    const colors = ['#00fff7', '#ff007c', '#ffaa00'];
    const icons = [
      // pill
      [
        [1,1],
        [1,1]
      ],
      // cig
      [
        [1,1,1,1]
      ],
      // pipe
      [
        [1,1,0],
        [0,1,1]
      ]
    ];

    let currentPiece = createPiece();
    let lastFall = 0;
    let fallInterval = 60; // very fast tetris speed
    let score = 0;
    let timeLeft = 90;
    let gameOver = false;
    // === AUDIO SETUP ===
    const bleep = document.getElementById('bleep');
    const gulp = document.getElementById('gulp');

    function startAudio() {
      bleep.play().then(() => gulp.play());
      gulp.addEventListener('ended', () => {
        bleep.play();
        gulp.play();
      });
    }

    // === PIECE CREATION ===
    function createPiece() {
      const type = Math.floor(Math.random() * icons.length);
      return {
        shape: icons[type],
        color: colors[type],
        x: Math.floor(cols / 2) - 1,
        y: 0
      };
    }

    // === DRAW GAME ===
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // draw settled blocks
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (grid[y][x]) drawCell(x, y, grid[y][x]);
        }
      }
      // draw current piece
      for (let y = 0; y < currentPiece.shape.length; y++) {
        for (let x = 0; x < currentPiece.shape[y].length; x++) {
          if (currentPiece.shape[y][x]) {
            drawCell(currentPiece.x + x, currentPiece.y + y, currentPiece.color);
          }
        }
      }
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = color;
      ctx.fillRect(x * cell, y * cell, cell - 2, cell - 2);
    }

    // === COLLISION ===
    function collision() {
      for (let y = 0; y < currentPiece.shape.length; y++) {
        for (let x = 0; x < currentPiece.shape[y].length; x++) {
          if (currentPiece.shape[y][x]) {
            const newY = currentPiece.y + y;
            const newX = currentPiece.x + x;
            if (
              newY >= rows ||
              newX < 0 ||
              newX >= cols ||
              grid[newY][newX]
            ) return true;
          }
        }
      }
      return false;
    }

    // === MERGE & CLEAR ===
    function merge() {
      currentPiece.shape.forEach((row, y) => {
        row.forEach((val, x) => {
          if (val) grid[currentPiece.y + y][currentPiece.x + x] = currentPiece.color;
        });
      });

      // clear full rows
      let cleared = 0;
      for (let y = rows - 1; y >= 0; y--) {
        if (grid[y].every(cell => cell)) {
          grid.splice(y, 1);
          grid.unshift(Array(cols).fill(0));
          cleared++;
        }
      }
      if (cleared > 0) {
        score -= cleared * 50;
        document.getElementById('score').textContent = `Score: ${score}`;
      }
    }

    // === UPDATE ===
    function update(timestamp) {
      if (gameOver) return;
      if (!lastFall) lastFall = timestamp;
      const delta = timestamp - lastFall;
      if (delta > fallInterval) {
        currentPiece.y++;
        if (collision()) {
          currentPiece.y--;
          merge();
          if (currentPiece.y <= 0) {
            endGame();
            return;
          }
          currentPiece = createPiece();
        }
        lastFall = timestamp;
      }
      draw();
      requestAnimationFrame(update);
    }

    function endGame() {
      gameOver = true;
      ctx.fillStyle = '#ff007c';
      ctx.font = '24px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
    }

    // === TIMER ===
    setInterval(() => {
      if (!gameOver) {
        timeLeft--;
        if (timeLeft <= 0) {
          timeLeft = 0;
          endGame();
        }
        let mins = Math.floor(timeLeft / 60);
        let secs = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer').textContent = `Time Left: ${mins}:${secs}`;
      }
    }, 1000);

    // === START ===
    window.addEventListener('click', () => {
      if (!gameOver) {
        startAudio();
        requestAnimationFrame(update);
      }
    });
  </script>
</body>
</html>
