<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TETANUS</title>
<style>
  :root{
    --neon: #00f7d9;
    --accent: #ff2e74;
    --muted: rgba(255,255,255,0.06);
    --bg: #000;
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--neon);
    font-family: "Courier New", monospace;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow:hidden;
  }

  /* STARFIELD canvas sits behind everything */
  #starfield {
    position:fixed;
    inset:0;
    z-index:0;
    background: radial-gradient(ellipse at center, #070707 0%, #000 60%);
  }

  /* subtle CRT vignette + scanlines */
  .crt-overlay {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:40;
    mix-blend-mode:overlay;
  }
  .crt-overlay::before{
    content:"";
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 2px
    );
    opacity:0.08;
  }
  .crt-overlay::after{
    content:"";
    position:absolute;
    inset:-10%;
    pointer-events:none;
    background: radial-gradient(circle at 50% 35%, rgba(0,255,200,0.06), transparent 25%);
    mix-blend-mode:screen;
    opacity:0.9;
  }

  /* subtle flicker */
  @keyframes flicker { 
    0% {opacity:0.97} 50% {opacity:1} 100% {opacity:0.95}
  }
  .crt-overlay { animation: flicker 1.6s infinite ease-in-out; }

  /* Page layout */
  .ui-top {
    position:fixed;
    top:18px;
    left:18px;
    z-index:45;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .ui-top .title {
    font-size:18px;
    letter-spacing:0.18em;
    color:var(--neon);
    text-shadow:0 0 10px rgba(0,255,200,0.25);
  }
  .ui-top .subtitle {
    color:#9ff2e8;
    font-size:13px;
    opacity:0.9;
  }

  .ui-top-right {
    position:fixed;
    top:18px;
    right:18px;
    z-index:45;
    text-align:right;
    color:var(--neon);
  }
  .ui-top-right .timer, .ui-top-right .score {
    font-size:14px;
    margin-bottom:6px;
  }

  /* Lower-centered playfield box */
  .stage {
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:8vh;          /* lowered on the page */
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    width:320px;        /* container width (playfield + padding) */
    pointer-events:none; /* auto-play only */
  }

  /* Playfield frame */
  .playframe {
    width:280px;     /* inner playfield */
    height:560px;
    border:3px solid rgba(0,255,200,0.9);
    box-shadow: 0 0 40px rgba(0,255,200,0.16);
    background:linear-gradient(180deg, rgba(0,0,0,0.8), rgba(0,0,0,0.92));
    position:relative;
    overflow:hidden;
    display:grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(20, 1fr);
    gap:1px;
    padding:6px;
  }

  /* grid cell base */
  .cell {
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* pieces container (absolute so we can animate) */
  .piece {
    position:absolute;
    will-change: transform, opacity;
    filter: drop-shadow(0 0 8px rgba(0,255,200,0.2));
  }

  /* Game over overlay within frame */
  .frame-overlay {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:60;
    opacity:0;
    transition:opacity 400ms ease;
  }
  .frame-overlay.show { opacity:1; }

  /* responsive tweak */
  @media (max-width:520px){
    .stage { width:92vw; }
    .playframe { width:86vw; height: calc(86vw * 2); } /* keep ~10:20 */
  }
</style>
</head>
<body>

  <!-- Starfield canvas -->
  <canvas id="starfield"></canvas>

  <!-- Top-left title -->
  <div class="ui-top">
    <div class="title">TETANUS</div>
    <div class="subtitle" id="subtitle">the broadcast</div>
  </div>

  <!-- Top-right info -->
  <div class="ui-top-right">
    <div class="timer" id="timeLeft">Time Left: 04:59</div>
    <div class="score" id="scoreDisplay">Score: -000000</div>
  </div>

  <!-- Lower center play area -->
  <div class="stage" aria-hidden="true">
    <div class="playframe" id="playframe">
      <!-- grid cells (visuals will be drawn into canvas or with absolutely positioned svgs) -->
    </div>

    <div class="frame-overlay" id="frameOverlay">
      <div style="color:var(--accent); font-family:monospace; font-size:28px; text-shadow:0 0 10px rgba(255,0,120,0.3)">GAME OVER</div>
    </div>
  </div>

  <div class="crt-overlay" aria-hidden="true"></div>

  <!-- audio elements (files should be in same folder) -->
  <audio id="bleep" src="Bleep (mxd).wav" preload="auto"></audio>
  <audio id="gulp"  src="G U L P (mxd).wav"  preload="auto"></audio>

<script>
/* CHUNK 1: visuals + audio prep
   Chunk 2 will add inline SVG pieces and the automated fast-play loop.
*/

/* STARFIELD */
const starCanvas = document.getElementById('starfield');
const sctx = starCanvas.getContext('2d');
function resizeStar() {
  starCanvas.width = innerWidth;
  starCanvas.height = innerHeight;
}
window.addEventListener('resize', resizeStar);
resizeStar();

const stars = Array.from({length:160}, () => ({
  x: Math.random()*starCanvas.width,
  y: Math.random()*starCanvas.height,
  r: 0.6 + Math.random()*1.2,
  v: 0.05 + Math.random()*0.25,
  alphaBase: 0.3 + Math.random()*0.7
}));

function drawStars(){
  sctx.clearRect(0,0,starCanvas.width,starCanvas.height);
  for (const s of stars){
    sctx.globalAlpha = s.alphaBase * (0.8 + 0.4*Math.sin(Date.now()/1000 + s.x));
    sctx.fillStyle = '#fff';
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    sctx.fill();
    s.y += s.v;
    if (s.y > starCanvas.height) s.y = -2;
  }
  requestAnimationFrame(drawStars);
}
drawStars();

/* AUDIO: prepare elements, don't auto-play until we start sequence.
   We will speed up bleep in chunk 2. */
const bleep = document.getElementById('bleep');
const gulp = document.getElementById('gulp');
bleep.volume = 0.7;
gulp.volume = 0.7;
bleep.preload = 'auto';
gulp.preload = 'auto';

/* simple function to robustly start audio (try play, fallback to resume AudioContext) */
async function startAudioSequence() {
  try {
    bleep.playbackRate = 1.25; // 25% faster playback
    await bleep.play();
    bleep.onended = async () => {
      try {
        await gulp.play();
      } catch(e){ console.warn('gulp play blocked', e); }
      gulp.onended = async () => {
        // loop back to start
        try {
          await bleep.play();
        } catch(e){ console.warn('bleep play blocked on loop', e); }
      };
    };
  } catch(e){
    // autoplay blocked: try WebAudio fallback or require a tap
    console.warn('autoplay blocked; call startAudioSequence() on user gesture', e);
  }
}

/* expose for console if autoplay blocked */
window.startAudioSequence = startAudioSequence;

/* tidy helper for DOM usage in chunk 2 */
const UI = {
  playframe: document.getElementById('playframe'),
  overlay:  document.getElementById('frameOverlay'),
  timeLeftEl: document.getElementById('timeLeft'),
  scoreEl: document.getElementById('scoreDisplay')
};


</script>
</body>
</html>
<script>
/* CHUNK 2: inline SVG pieces + automated fast-play loop
   Depends on Chunk 1's DOM: #playframe, UI.playframe, startAudioSequence()
*/

/* CONFIG */
const COLS = 10;
const ROWS = 20;
const DROP_MS = 40;              // very fast drop tick (ms)
const AUTO_SIDE_CHANCE = 0.25;   // chance per tick to attempt a side move
const AUTO_ROTATE_CHANCE = 0.08; // chance per tick to rotate
const PIECE_SPAWN_CHANCE = 0.9;  // spawn often so it looks busy

/* Inline SVGs (single-cell artwork) - scaled via CSS to cell size */
function makePillSVG() {
  return `<svg viewBox="0 0 24 24" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="g"><feGaussianBlur stdDeviation="0.6" result="b"/></filter></defs>
    <rect x="2" y="6" width="20" height="12" rx="6" fill="#ff3377"/>
    <rect x="12" y="6" width="10" height="12" rx="6" fill="#ffffff" opacity="0.95"/>
    <rect x="12" y="6" width="10" height="12" rx="6" fill="#ffffff" opacity="0.06"/>
  </svg>`;
}
function makeCigSVG() {
  return `<svg viewBox="0 0 24 24" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="9" width="16" height="6" rx="2" fill="#f2e2c6"/>
    <rect x="18" y="9" width="4" height="6" rx="2" fill="#ff6b2e"/>
    <circle cx="20" cy="7" r="1.4" fill="#ccc" opacity="0.6"/>
  </svg>`;
}
function makePipeSVG() {
  // stylized crack-pipe / small pipe icon
  return `<svg viewBox="0 0 24 24" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="10" width="16" height="4" rx="2" fill="#bfbfbf"/>
    <rect x="14" y="6" width="3" height="8" rx="1" fill="#6fd2e0" opacity="0.9"/>
    <circle cx="19" cy="12" r="3" fill="#66f7e0" opacity="0.28"/>
  </svg>`;
}

/* PIECE TEMPLATES (matrix form). Each cell = 1 block at current scale */
const PIECE_TEMPLATES = [
  { id: 'pill', shape: [[1,1]], svg: makePillSVG() },           // horizontal capsule (2x1)
  { id: 'cig',  shape: [[1,1,1,1]], svg: makeCigSVG() },        // long cigarette (4x1)
  { id: 'pipe', shape: [[1,1],[0,1]], svg: makePipeSVG() }      // small L-ish (2x2)
];

/* GRID state (holds SVG string or null) */
let grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));

/* Build static cell DOMs to display settled blocks */
const playframe = UI.playframe;
function buildGridCells(){
  playframe.innerHTML = ''; // clear
  // create ROWS*COLS empty cell placeholders so we can place content via grid cell index
  for (let r=0;r<ROWS;r++){
    for (let c=0;c<COLS;c++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      // using CSS grid — these are auto-placed in DOM order
      playframe.appendChild(cell);
    }
  }
}
buildGridCells();

/* Utility: compute cell size / offsets dynamically */
function getCellSize(){
  const rect = playframe.getBoundingClientRect();
  return { w: rect.width / COLS, h: rect.height / ROWS, left: rect.left, top: rect.top };
}

/* RENDER settled grid into the cell placeholders */
function renderSettled(){
  const cells = playframe.children;
  let idx = 0;
  for (let r=0;r<ROWS;r++){
    for (let c=0;c<COLS;c++){
      const cell = cells[idx++];
      cell.innerHTML = grid[r][c] || '';
      // if the innerHTML contains an svg, ensure it sizes well
      const svg = cell.querySelector('svg');
      if(svg){
        svg.style.width = '86%';
        svg.style.height = '86%';
      }
    }
  }
}

/* Active piece representation:
   piece = { template, x, y, orientation, blocks:[DOM elems per block] }
*/
let active = null;
let activeEls = []; // DOM elements for the active piece blocks

/* spawn a new piece (random template) */
function spawn(){
  const tpl = PIECE_TEMPLATES[Math.floor(Math.random()*PIECE_TEMPLATES.length)];
  // starting x centered-ish
  const width = tpl.shape[0].length;
  const startX = Math.max(0, Math.floor((COLS - width)/2));
  active = {
    template: tpl,
    shape: tpl.shape.map(row => row.slice()), // copy
    x: startX,
    y: 0,
    dir: 0
  };
  // create DOM elements for each 1 in shape
  removeActiveEls();
  activeEls = [];
  for (let r=0;r<active.shape.length;r++){
    for (let c=0;c<active.shape[r].length;c++){
      if (active.shape[r][c]){
        const el = document.createElement('div');
        el.className = 'piece';
        el.innerHTML = tpl.svg;
        // size and position via CSS grid coordinates:
        el.style.gridColumnStart = (active.x + c + 1);
        el.style.gridRowStart = (active.y + r + 1);
        el.style.width = '100%';
        el.style.height = '100%';
        // make sure svg fits
        const sv = el.querySelector('svg');
        if (sv){ sv.style.width='86%'; sv.style.height='86%'; }
        playframe.appendChild(el);
        activeEls.push({el, ox:c, oy:r});
      }
    }
  }
}

/* remove active DOM elements */
function removeActiveEls(){
  for(const a of activeEls) if (a.el && a.el.parentNode === playframe) playframe.removeChild(a.el);
  activeEls = [];
}

/* collision check for a hypothetical offset or rotated shape */
function collidesAt(shape, x, y){
  for (let r=0;r<shape.length;r++){
    for (let c=0;c<shape[r].length;c++){
      if (!shape[r][c]) continue;
      const gx = x + c;
      const gy = y + r;
      if (gx < 0 || gx >= COLS || gy >= ROWS) return true;
      if (gy >= 0 && grid[gy][gx]) return true;
    }
  }
  return false;
}

/* rotate shape clockwise (returns new matrix) */
function rotateShape(shape){
  const H = shape.length, W = shape[0].length;
  const out = Array.from({length:W}, ()=>Array(H).fill(0));
  for (let r=0;r<H;r++){
    for (let c=0;c<W;c++){
      out[c][H - 1 - r] = shape[r][c];
    }
  }
  return out;
}

/* lock active piece into grid and clean up */
function lockActive(){
  const shape = active.shape;
  for (let r=0;r<shape.length;r++){
    for (let c=0;c<shape[r].length;c++){
      if (!shape[r][c]) continue;
      const gx = active.x + c;
      const gy = active.y + r;
      if (gy >= 0 && gy < ROWS && gx >= 0 && gx < COLS){
        grid[gy][gx] = active.template.svg;
      }
    }
  }
  removeActiveEls();
  active = null;
  clearLines();
  renderSettled();
}

/* clear full lines and score */
function clearLines(){
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--){
    if (grid[r].every(cell => cell !== null)){
      grid.splice(r, 1);
      grid.unshift(Array(COLS).fill(null));
      cleared++;
      r++; // recheck same index after splice
    }
  }
  if (cleared > 0){
    // glow effect on frame
    UI.playframe.style.boxShadow = '0 0 48px rgba(0,255,200,0.28)';
    setTimeout(()=> UI.playframe.style.boxShadow = '', 350);
    // update score negatively as requested
    const s = parseInt(UI.scoreEl.textContent.replace(/\D/g,'')) || 0;
    const newS = (s - cleared * 100);
    UI.scoreEl.textContent = `Score: ${newS}`;
  }
}

/* move active piece by offsets (dx, dy, optionally rotate) */
function moveActive(dx, dy, tryRotate=false){
  if (!active) return false;
  let newShape = active.shape;
  if (tryRotate){
    const rotated = rotateShape(active.shape);
    // adjust x if rotated would overflow right
    let newX = active.x;
    if (active.x + rotated[0].length > COLS) newX = COLS - rotated[0].length;
    if (!collidesAt(rotated, newX, active.y + dy)){
      active.shape = rotated;
      active.x = newX;
      activeEls.forEach(a => a.el.remove()); // we'll re-create below
      activeEls = [];
      // re-create activeEls based on new shape
      for (let r=0;r<active.shape.length;r++){
        for (let c=0;c<active.shape[r].length;c++){
          if (active.shape[r][c]){
            const el = document.createElement('div');
            el.className = 'piece';
            el.innerHTML = active.template.svg;
            el.style.gridColumnStart = (active.x + c + 1);
            el.style.gridRowStart = (active.y + r + 1);
            el.style.width = '100%';
            el.style.height = '100%';
            playframe.appendChild(el);
            activeEls.push({el, ox:c, oy:r});
          }
        }
      }
      return true;
    }
    return false;
  } else {
    const nx = active.x + dx;
    const ny = active.y + dy;
    if (!collidesAt(active.shape, nx, ny)){
      active.x = nx;
      active.y = ny;
      // update DOM positions
      for (const a of activeEls){
        a.el.style.gridColumnStart = (active.x + a.ox + 1);
        a.el.style.gridRowStart = (active.y + a.oy + 1);
      }
      return true;
    }
    return false;
  }
}

/* AUTO move & tick loop */
let lastTick = performance.now();
let spawnCooldown = 0;
function tick(now){
  const elapsed = now - lastTick;
  if (elapsed >= DROP_MS){
    // 1) spawn new piece if none
    if (!active && Math.random() < PIECE_SPAWN_CHANCE){
      spawn();
    }
    // 2) auto lateral movement sometimes (makes it look played)
    if (active){
      // occasionally rotate
      if (Math.random() < AUTO_ROTATE_CHANCE){
        moveActive(0,0,true);
      }
      // sometimes try side move
      if (Math.random() < AUTO_SIDE_CHANCE){
        const dir = Math.random() < 0.5 ? -1 : 1;
        moveActive(dir,0,false);
      }
      // try to drop by 1; if cannot, lock it
      if (!moveActive(0,1,false)){
        // small buffer: if at very top and can't lock, end -> reset
        if (active.y <= 0){
          showGameOverAndReset();
          lastTick = now;
          requestAnimationFrame(tick);
          return;
        }
        lockActive();
      }
    }
    lastTick = now;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* Show Game Over overlay then reset (fade & vhs flash) */
function showGameOverAndReset(){
  UI.overlay.classList.add('show');
  // small flicker / static pulse
  document.body.style.filter = 'brightness(0.4) contrast(1.4)';
  setTimeout(()=>{ document.body.style.filter = ''; }, 800);
  setTimeout(()=> {
    UI.overlay.classList.remove('show');
    // reset grid
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    renderSettled();
    // reset score/time a bit
    UI.scoreEl.textContent = 'Score: 0';
    // continue autoplay seamlessly
  }, 1500);
}

/* INITIAL render */
renderSettled();

/* TIMER display (sync with UI) */
let timeLeft = 299;
UI.timeLeftEl.textContent = formatTime(timeLeft);
const timerInterval = setInterval(()=>{
  timeLeft--;
  if (timeLeft <= 0){
    // trigger end->reset behaviour but keep playing
    timeLeft = 299;
    showGameOverAndReset();
  }
  UI.timeLeftEl.textContent = formatTime(timeLeft);
}, 1000);

function formatTime(t){
  const m = Math.floor(t/60).toString().padStart(2,'0');
  const s = (t % 60).toString().padStart(2,'0');
  return `Time Left: ${m}:${s}`;
}

/* attempt to auto-start audio (best-effort); also attach a one-tap fallback */
startAudioSequence().catch?.(()=>{});
function onFirstTouch(){
  // ensure audio plays if blocked
  startAudioSequence().catch(()=>{});
  window.removeEventListener('pointerdown', onFirstTouch);
}
window.addEventListener('pointerdown', onFirstTouch, { once:true });

/* Expose a console helper to force spawn (dev) */
window._spawn = spawn;
window._grid = grid;
</script>
