<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TETANUS</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    height: 100%;
    font-family: monospace;
    color: #0ff;
  }

  /* === CRT Scanline Overlay === */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.03),
      rgba(255,255,255,0.03) 1px,
      transparent 2px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 5;
    animation: flicker 0.15s infinite alternate;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }

  /* === Starfield Background === */
  #stars {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #111 0%, #000 100%);
    overflow: hidden;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: white;
    width: 2px;
    height: 2px;
    opacity: 0.8;
    animation: twinkle 3s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* === Playfield layout === */
  #game-container {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  #ui {
    position: absolute;
    top: 2%;
    left: 3%;
    text-align: left;
    color: #0ff;
  }

  #ui h1 {
    font-size: 1.5em;
    letter-spacing: 2px;
  }

  #timer, #score {
    font-size: 1.2em;
    margin-top: 0.5em;
  }

  #playfield {
    display: grid;
    grid-template-columns: repeat(10, 24px);
    grid-template-rows: repeat(20, 24px);
    gap: 1px;
    background: rgba(0, 0, 0, 0.4);
    border: 2px solid #0ff;
    box-shadow: 0 0 20px rgba(0,255,255,0.3);
    position: relative;
  }

  .cell {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* === Neon Glow + Pulse Patch === */
  #playfield svg {
    filter: drop-shadow(0 0 6px rgba(0,255,255,0.5));
    transition: transform 0.2s ease-in-out, filter 0.3s ease;
  }

  #playfield svg:hover {
    transform: scale(1.1);
    filter: drop-shadow(0 0 10px rgba(255,100,200,0.8));
  }

  @keyframes pulseBorder {
    0%, 100% { box-shadow: 0 0 20px rgba(0,255,200,0.3); }
    50% { box-shadow: 0 0 35px rgba(0,255,200,0.7); }
  }

  #playfield {
    animation: pulseBorder 4s ease-in-out infinite;
  }

  .cell svg {
    opacity: 0;
    animation: fadeInPiece 0.5s forwards ease-in;
  }

  @keyframes fadeInPiece {
    to { opacity: 1; }
  }
</style>
</head>

<body>
  <div id="stars"></div>

  <div id="ui">
    <h1>TETANUS</h1>
    <div id="timer">Time’sUp 03:45</div>
    <div id="score">Score: -0000123</div>
  </div>

  <div id="game-container">
    <div id="playfield"></div>
  </div>

<script>
  // Generate starfield
  const starsContainer = document.getElementById("stars");
  for (let i = 0; i < 150; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random() * 100 + "%";
    s.style.left = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 3) + "s";
    starsContainer.appendChild(s);
  }
</script>
<script>
  const playfield = document.getElementById("playfield");
  const scoreDisplay = document.getElementById("score");
  const timerDisplay = document.getElementById("timer");

  const rows = 20;
  const cols = 10;
  const grid = Array.from({ length: rows }, () => Array(cols).fill(null));

  // === Stylized flat SVGs ===
  const pieces = [
    `<svg width="18" height="8" viewBox="0 0 18 8"><rect width="18" height="8" rx="4" fill="#ff6699"/><rect x="9" width="9" height="8" rx="4" fill="#ffffff"/></svg>`, // pill
    `<svg width="16" height="6" viewBox="0 0 16 6"><rect width="16" height="6" rx="2" fill="#d4c8b0"/><rect x="12" width="4" height="6" rx="2" fill="#ff3300"/></svg>`, // cigarette
    `<svg width="14" height="8" viewBox="0 0 14 8"><rect width="10" height="4" y="2" rx="1" fill="#cccccc"/><circle cx="12" cy="4" r="2" fill="#99ffff"/></svg>` // pipe
  ];

  function drawGrid() {
    playfield.innerHTML = "";
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        if (grid[y][x]) cell.innerHTML = grid[y][x];
        playfield.appendChild(cell);
      }
    }
  }

  function spawnPiece() {
    const shape = pieces[Math.floor(Math.random() * pieces.length)];
    return { x: Math.floor(cols / 2), y: 0, shape };
  }

  let current = spawnPiece();
  let dropSpeed = 50; // ⚡ twice as fast
  let score = -123;
  let countdown = 225; // fake timer value
  let timer = null;

  function canMoveDown(piece) {
    if (piece.y + 1 >= rows) return false;
    return !grid[piece.y + 1][piece.x];
  }

  function placePiece(piece) {
    if (piece.y >= 0 && piece.y < rows && piece.x >= 0 && piece.x < cols) {
      grid[piece.y][piece.x] = piece.shape;
    }
  }

  function clearLines() {
    for (let y = rows - 1; y >= 0; y--) {
      if (grid[y].every(cell => cell !== null)) {
        grid.splice(y, 1);
        grid.unshift(Array(cols).fill(null));
      }
    }
  }

  function step() {
    if (canMoveDown(current)) {
      current.y++;
    } else {
      placePiece(current);
      clearLines();
      current = spawnPiece();
    }
    drawGrid();
    renderPiece(current);
    updateScore();
    updateTimer();
  }

  function renderPiece(piece) {
    const index = piece.y * cols + piece.x;
    const cells = playfield.children;
    if (cells[index]) cells[index].innerHTML = piece.shape;
  }

  function updateScore() {
    score -= 3;
    scoreDisplay.textContent = `Score: ${score}`;
  }

  function updateTimer() {
    countdown--;
    if (countdown <= 0) {
      timerDisplay.textContent = "Time’sUp 00:00";
      restartGame();
    } else {
      const min = Math.floor(countdown / 60);
      const sec = countdown % 60;
      timerDisplay.textContent = `Time’sUp ${min.toString().padStart(2,"0")}:${sec.toString().padStart(2,"0")}`;
    }
  }

  function restartGame() {
    clearInterval(timer);
    for (let y = 0; y < rows; y++) {
      grid[y].fill(null);
    }
    current = spawnPiece();
    score = -123;
    countdown = 225;
    timer = setInterval(step, dropSpeed);
  }

  drawGrid();
  timer = setInterval(step, dropSpeed);
</script>
<script>
  // === Audio Setup: plays Bleep (mxd) then G U L P (mxd), then loops ===
  const tracks = [
    "Bleep (mxd).wav",
    "G U L P (mxd).wav"
  ];
  let currentTrack = 0;

  const audio = new Audio(tracks[currentTrack]);
  audio.volume = 0.7;
  audio.loop = false;
  audio.play();

  audio.addEventListener("ended", () => {
    currentTrack = (currentTrack + 1) % tracks.length;
    const next = new Audio(tracks[currentTrack]);
    next.volume = 0.7;
    next.loop = false;
    next.play();
    fadeBetween(audio, next);
  });

  // Smooth crossfade between tracks
  function fadeBetween(oldTrack, newTrack) {
    let fade = setInterval(() => {
      if (oldTrack.volume > 0.05) {
        oldTrack.volume -= 0.05;
      } else {
        oldTrack.pause();
        clearInterval(fade);
      }
    }, 200);
  }

  // === Ambient CRT flicker pulse ===
  const scoreEl = document.getElementById("score");
  const timerEl = document.getElementById("timer");
  setInterval(() => {
    scoreEl.style.opacity = 0.7 + Math.random() * 0.3;
    timerEl.style.opacity = 0.7 + Math.random() * 0.3;
  }, 120);
</script>

</body>
</html>
